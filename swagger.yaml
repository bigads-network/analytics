openapi: 3.0.0
info:
  title: Bigads API
  description: API documentation for Bigads
  version: 0.0.1
servers:
  - url: http://localhost:8008
    description: Local server
  - url: https://bigads-efwrc.ondigitalocean.app/
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /creator/register:
    post:
      tags:
        - Creator    
      summary: Register a creator
      description: Registers a creator with device data and returns authentication details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                devicedata:
                  type: object
                  properties:
                    imei:
                      type: string
                      example: "123456789012345"
                    model:
                      type: string
                      example: "iPhone 14"
                    brand:
                      type: string
                      example: "Apple"
                    sysName:
                      type: string
                      example: "iOS"
                    sysVersion:
                      type: string
                      example: "17.0"
      responses:
        "200":
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User Logged In || User Is regsitered successfully "
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      userId:
                        type: string
                        example: "creator_8MD6L1O6"
                      role:
                        type: string
                        example: "creator"
                      devicedata:
                        type: object
                        properties:
                          imei:
                            type: string
                            example: "123456789012345"
                          model:
                            type: string
                            example: "iPhone 14"
                          brand:
                            type: string
                            example: "Apple"
                          sysName:
                            type: string
                            example: "iOS"
                          sysVersion:
                            type: string
                            example: "17.0"
                      saAddress:
                        type: string
                        example: "0x99d49172Dd95171a93dbF171795F640b618C4639"
                      walletAddress:
                        type: string
                        example: "0xbE85bC29A9447Be16B9569dAA0Cc26378211738f"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInJvbGUiOiJjcmFldG9yIiwidHlwZSI6ImFjY2VzcyIsImV4cCI6MTc0Mjc2MDc5M30.4pgzkoI6hg_-kl-64WC4ao36v2eN9Cin_heHADyMfZU"
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request data"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"

  /creator/game:
    post:
      tags:
        - Creator
      summary: Register a game
      description: Registers a game under a creator account and returns game details.
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Bearer <your_token_here>
          description: Bearer token for authentication. Replace `<your_token_here>` with your actual token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gameName:
                  type: string
                  example: "Apex Legend"
                gameType:
                  type: string
                  example: "Arcade"
                description:
                  type: string
                  example: "A fast-paced battle arcade game where players fight to be the last one standing."
      responses:
        "200":
          description: Game registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Game registered Successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      creatorId:
                        type: integer
                        example: 1
                      gameId:
                        type: string
                        example: "game_A3UNVG1A"
                      gameName:
                        type: string
                        example: "Apex Legend"
                      gameType:
                        type: string
                        example: "Arcade"
                      description:
                        type: string
                        example: "A fast-paced battle arcade game where players fight to be the last one standing."
                      saAddress:
                        type: string
                        example: "0x2381dc99F6c32F1a09793b3728c4b2111e4C5371"
                      walletAddress:
                        type: string
                        example: "0xdDB691F89515023D277f991ac9eEB2d3550832ed"
                  gameToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYW1lSWQiOjQsImlhdCI6MTc0Mjc0ODg1MywiZXhwIjoxNzQyNzUyNDUzfQ.ASIcQ0NLtbSS1GG_xXat6tBe4qJruHMAUdZp0q9duiE"
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Game data is required"
        "401":
          description: Unauthorized - Invalid role for game creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid role for Game Creation"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"

  /creator/events/:
    post:
      tags:
        - Creator
      summary: Create events for a particular game
      description: This endpoint creates an event for a particular game.
      security:
        - bearerAuth: []
      parameters:
        - name: game_authorization_token
          in: header
          required: true
          schema:
            type: string
          description: JWT token for game authentication.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer token for authentication.
          example: "Bearer <your_token_here>"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  description: The type of event being created.
                  example: TekkenChampionship
      responses:
        "200":
          description: Event created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event created
                  event:
                    type: object
                    properties:
                      eventId:
                        type: string
                        description: The ID of the created event.
                        example: event_A4I40CEH
        "400":
          description: Bad Request - Invalid input data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid game ID or request body.
        "401":
          description: Unauthorized - Invalid or missing bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthorized. Please provide a valid token.
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to create event due to a server error.

  /user/game:
    get:
      tags:
        - user
      summary: Fetch a list of games
      description: Retrieves a list of games created by users.
      responses:
        "200":
          description: Game list fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Game List Fetched Successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the game.
                          example: 1
                        creatorId:
                          type: integer
                          description: ID of the creator of the game.
                          example: 1
                        gameId:
                          type: string
                          description: Unique game identifier.
                          example: "game_69HS62B2"
                        walletAddress:
                          type: string
                          description: Wallet address associated with the game.
                          example: "0x66fFE2b3d99F986E0d073e1815a250b273fEDFAD"
                        gameSaAddress:
                          type: string
                          description: Smart contract address for the game.
                          example: "0x61CbB7a3E853877000E48cB0f2800fed8b9Cd55C"
                        gameName:
                          type: string
                          description: Name of the game.
                          example: "Battle Royale X"
                        gameType:
                          type: string
                          description: Type of the game.
                          example: "Multiplayer"
                        description:
                          type: string
                          description: A short description of the game.
                          example: "A high-intensity battle royale where players compete to be the last one standing."
                        createdAt:
                          type: string
                          format: date-time
                          description: Timestamp when the game was created.
                          example: "2025-03-22T12:25:28.656Z"
        "401":
          description: Unauthorized - Missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthorized. Please provide a valid token."
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Failed to fetch game list due to a server error."

  /user/events:
    get:
      tags:
        - user
      summary: Fetch a list of events
      description: Retrieves a list of events associated with games.
      responses:
        "200":
          description: Event list fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Event List Fetched Successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId:
                          type: string
                          description: Unique identifier for the event.
                          example: "event_PFWCJU8Z"
                        eventType:
                          type: string
                          description: Type of event.
                          example: "Holi Event"
                        game:
                          type: object
                          properties:
                            gameId:
                              type: string
                              description: Unique game identifier.
                              example: "game_69HS62B2"
                            gameName:
                              type: string
                              description: Name of the game.
                              example: "Battle Royale X"
                            gameType:
                              type: string
                              description: Type of the game.
                              example: "Multiplayer"
                            description:
                              type: string
                              description: A short description of the game.
                              example: "A high-intensity battle royale where players compete to be the last one standing."
        "401":
          description: Unauthorized - Missing or invalid bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthorized. Please provide a valid token."
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Failed to fetch event list due to a server error."

  /user/fireEvent/{eventId}:
    post:
      tags:
        - user    
      summary: Fire an event
      description: Triggers an event, saves transaction details, and returns user information.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                devicedata:
                  type: object
                  properties:
                    deviceId:
                      type: string
                      example: "iQOO neo"
                    sysName:
                      type: string
                      example: "android"
      responses:
        200:
          description: Event fired successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Event Fired Successfully"
                  transactionDetails:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      gameId:
                        type: integer
                        example: 4
                      userId:
                        type: integer
                        example: 52
                      eventId:
                        type: integer
                        example: 3
                      transactionHash:
                        type: string
                        example: "0x1c0b3d66a19eb55b17119549f56fc9e94ecbdfba3d7aae4bb4741e9d1e65a03a"
                      transaction_chain:
                        type: string
                        example: "polygon"
                      amount:
                        type: string
                        example: "0"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      userId:
                        type: string
                        example: "user_16YJIPST"
                      role:
                        type: string
                        example: "user"
                      saAddress:
                        type: string
                        example: "0x8d8D9956e5CcCF5e2BdB9DAA7Bc13fdA04Bba1Eb"
                      walletAddress:
                        type: string
                        example: "0xD011790342443fc5d4D642d89e02fD9D6196326F"
        400:
          description: Bad request, missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request data"
        404:
          description: Event not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Event not found"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"
