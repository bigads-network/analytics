openapi: 3.0.0
info:
  title: Bigads API
  description: API documentation for Bigads
  version: 0.0.1
servers:
  - url: http://localhost:8008
    description: Local server
  - url: https://bigads-efwrc.ondigitalocean.app/
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /user/registerUser:
    post:
      summary: Return login user if not registered, if not registered, performs registration.
      description: Optional extended description in CommonMark or HTML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maAddress:
                 type: string
                appId:
                  type: string
                deviceId:
                  type: string
              required:
                - appId
                - deviceId
      responses:
        "200":
          description: A JSON object containing user details and a token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User Logged In
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        example: user_607LHYRR
                      appId:
                        type: string
                        example: AppTESTID12311
                      deviceId:
                        type: string
                        example: TESTDEVICEID111234
                      saAddress:
                        type: string
                        example: 0xb34c1506FCca7CFd00Da4158315e2A2291928323
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInJvbGUiOiJjcmVhdG9yIiwidHlwZSI6ImFjY2VzcyIsImV4cCI6MTczNjk1MDg5M30.LLQdFdxTkK_BbY403G2HBrx4RbP7SCh2Ni2ccIQL80c
        "500":
          description: Internal server error - Database Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /user/requestCreator:
    post:
      summary: Submit a creator request for a user
      description: Creates a creator request for a user if they exist and don’t already have a pending or fulfilled request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maAddress:
                  type: string
                  example: "0xb34c1506FCca7CFd00Da4158315e2A2291928323"
                  description: The user's address (e.g., a blockchain or unique identifier).
              required:
                - maAddress
      responses:
        "200":
          description: Creator request successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Creator request created"
                  data:
                    type: object
                    description: Details of the created request (structure depends on the database service response).
                    example:
                      id: 123
                      maAddress: "0xb34c1506FCca7CFd00Da4158315e2A2291928323"
                      userRole: "creator"
                      status: "pending"
        "400":
          description: Bad request due to existing pending or fulfilled request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "You already have a pending creator request"
        "404":
          description: User not found or failed to create the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "User not found"
        "500":
          description: Server error occurred during request processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"

  /user/creator-requests/{maAddress}/approve:
    patch:
      summary: Approve or reject a creator request
      description: Allows an admin to approve or reject a pending creator request identified by the user's maAddress.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: maAddress
          required: true
          schema:
            type: string
            example: "0xb34c1506FCca7CFd00Da4158315e2A2291928323"
          description: The unique address of the user whose creator request is being processed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                responseType:
                  type: string
                  enum: ["Approve", "Reject"]
                  example: "Approve"
                  description: Specifies whether to approve or reject the creator request.
              required:
                - responseType
      responses:
        "200":
          description: Creator request successfully approved or rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Creator request approved successfully"
                  data:
                    type: object
                    description: Details of the processed request (structure depends on database service response).
                    example:
                      maAddress: "0xb34c1506FCca7CFd00Da4158315e2A2291928323"
                      status: "approved"
                      userRole: "creator"
        "400":
          description: Invalid request due to incorrect response type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid response type. Must be either 'Approve' or 'Reject'"
        "403":
          description: Forbidden if the requester is not an admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Only admin can process creator requests"
        "404":
          description: Creator request not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Creator request not found"
        "401":
          description: Unauthorized if authentication fails or token is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "UNAUTHOURIZED USER"
        "500":
          description: Server error occurred during request processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"

  /user/getPendingRequests:
    get:
      summary: Fetch all pending creator requests
      description: Retrieves a list of pending creator requests. Accessible only to authenticated admin users.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully fetched pending creator requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Pending requests fetch successful"
                  data:
                    type: array
                    description: List of pending creator requests (structure depends on database service response).
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 123
                        maAddress:
                          type: string
                          example: "0xb34c1506FCca7CFd00Da4158315e2A2291928323"
                        userRole:
                          type: string
                          example: "creator"
                        status:
                          type: string
                          example: "pending"
        "400":
          description: Invalid request due to malformed Authorization header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid Authorization token format. Must be a Bearer JWT token."
        "401":
          description: Unauthorized if authentication fails or token is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "UNAUTHOURIZED USER"
        "403":
          description: Forbidden if the user is not an admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Access denied. Admin privileges required"
        "404":
          description: Admin user not found in the system.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "User not found"
        "500":
          description: Server error occurred during request processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"
                  error:
                    type: string
                    example: "Database connection failed"

  /user/registerGame:
    post:
      summary: Return Game Registration with events details and you should be at creator role to register a game.
      description: Optional extended description in CommonMark or HTML.
      parameters:
      - in: headers
        name: Authorization
        required: true
        schema:
          type: string
          example: Bearer <your_token_here>
        description: Bearer token for authentication. Replace `<your_token_here>` with your actual token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_address:
                  type: string
                  example: "string"
                name:
                  type: string
                  example: TekkenChampionship
                type:
                  type: string
                  example: tekken
                description:
                  type: string
                  example: A thrilling online battle championship.
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      eventType:
                        type: string
                        example: Solo Match
              required:
                - name
                - type
                - description
                - events
      responses:
        "200":
          description: A JSON object containing the registered game and its events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Game registered Succesfully
                  data:
                    type: object
                    properties:
                      game:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 4
                          createrId:
                            type: integer
                            example: 1
                          gameId:
                            type: string
                            example: game_XXTI9R8L
                          gameSaAddress:
                            type: string
                            example: 0x25D0678F52F60b2340F6B8302bd9702Fe1432085
                          name:
                            type: string
                            example: TekkenChampionship
                          type:
                            type: string
                            example: tekken
                          description:
                            type: string
                            example: A thrilling online battle championship.
                          createdAt:
                            type: string
                            format: date-time
                            example: 2025-01-15T07:33:14.258Z
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            gameId:
                              type: integer
                              example: 4
                            eventId:
                              type: string
                              example: event_XFD2AT7Q
                            eventType:
                              type: string
                              example: Solo Match
                      Gametoken:
                        type: string
                        example: game_token
        "401":
          description: Unauthorized - Invalid or Expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: Internal server error - Database Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /creator/events/{gameId}:
    post:
      summary: Create events for a particular game
      description: This endpoint creates events for a particular game.
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          description: The ID of the game for which the event is being created.
          schema:
            type: integer
            example: 4
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authentication.
          schema:
            type: string
            example: Bearer <your_token_here>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  description: The type of event being created.
                  example: TekkenChampionship
      responses:
        "200":
          description: Event created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event created
                  event:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId:
                          type: string
                          description: The ID of the created event.
                          example: event_A4I40CEH
        "400":
          description: Bad Request - Invalid input data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid game ID or request body.
        "401":
          description: Unauthorized - Invalid or missing bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthorized. Please provide a valid token.
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to create event due to a server error.

  /creator/gameToken:
    post:
      summary: Update game token
      description: Updates the token associated with a specified game. Returns the updated token details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gameId:
                  type: string
                  description: Unique identifier of the game for which the token is being updated
                  example: "game_xyz789"
              required:
                - gameId
      responses:
        '200':
          description: Success - Game token updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Updated game token"
                  data:
                    type: object
                    description: Updated token details (structure depends on database response)
                    properties:
                      gameId:
                        type: string
                        example: "game_xyz789"
                      token:
                        type: string
                        description: The updated game token
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                required:
                  - status
                  - message
                  - data
        '500':
          description: Internal Server Error - Unexpected error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"
                required:
                  - status
                  - message

  /creator/sendEvents:
    post:
      summary: Send events for a game
      description: Sends an event for a specified game, either for an authenticated user or a new user identified by appId and deviceId. Requires both user authentication (via JWT) and game authentication (via game_authorization_token). Creates a smart account transaction and saves the details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                  description: Unique identifier of the event to send
                  example: "event_123"
                wallet_address:
                  type: string
                  description: wallet address of particuular user account
                  example: "gkjscjhfkavkqjakejblvbllkbv"
              required:
                - eventId
                - wallet_address
      parameters:
        - in: header
          name: game_authorization_token
          schema:
            type: string
          required: true
          description: JWT token for game authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Success - Event sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Event sent successfully."
                  data:
                    type: object
                    description: Transaction details (structure depends on database response)
                    properties:
                      gameId:
                        type: string
                        example: "game_xyz789"
                      creatorId:
                        type: string
                        example: "user_creator123"
                      userId:
                        type: string
                        example: "user_abc456"
                      eventId:
                        type: string
                        example: "event_123"
                      transactionHash:
                        type: string
                        example: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
                      value:
                        type: string
                        example: "0"
                      gameSaAddress:
                        type: string
                        example: "0x1234567890abcdef1234567890abcdef12345678"
                      saAddress:
                        type: string
                        example: "0xabcdef1234567890abcdef1234567890abcdef12"
                  token:
                    type: string
                    description: Authentication token (returned if new user is created)
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                required:
                  - status
                  - message
                  - data
        '400':
          description: Bad Request - Missing required fields or invalid headers
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Missing required fields: appId, deviceId"
                    required:
                      - status
                      - message
                  - type: object
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Invalid Headers Authorization Token Missing."
                    required:
                      - status
                      - message
        '401':
          description: Unauthorized - Missing or invalid tokens
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Token is missing from gameAuthorization header"
                    required:
                      - message
                  - type: object
                    properties:
                      status:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "UNAUTHOURIZED USER"
                    required:
                      - status
                      - message
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "User authentication failed."
                    required:
                      - message
        '403':
          description: Forbidden - Invalid game token or unapproved game
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Invalid or expired Game token"
                      error:
                        type: string
                        example: "Token expired"
                    required:
                      - message
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Game is not approved for sending events"
                    required:
                      - message
        '404':
          description: Not Found - Event or game not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Event for game not found."
                required:
                  - message
        '500':
          description: Internal Server Error - Unexpected error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"
                required:
                  - status
                  - message

  /user/transactions:
    get:
      summary: Fetch user transactions
      description: Retrieves a list of transactions for the user
      responses:
        '200':
          description: Transaction fetch successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "transaction fetch successful"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transactionHash:
                          type: string
                          example: "0xd089b541f5a0d16437a341a7967245d298b516dec8f6c205bb615ba3b34134b3"
                        event:
                          type: object
                          properties:
                            eventType:
                              type: string
                              example: "Solo Match"
                            eventId:
                              type: string
                              example: "event_XFD2AT7Q"
                        toUser:
                          type: object
                          properties:
                            userId:
                              type: string
                              example: "user_607LHYRR"
                        game:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "TekkenChampionship"
                            type:
                              type: string
                              example: "tekken"
                            gameId:
                              type: string
                              example: "game_XXTI9R8L"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"

  /user/count:
    get:
      summary: Fetch the total count of users
      description: Retrieves the total count of users or similar resources from the system.
      responses:
        "200":
          description: Successfully fetched the count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "count fetch successful"
                  data:
                    type: number
                    description: The total count of users or resources.
                    example: 42
        "500":
          description: Server error occurred during count retrieval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"
          
  /user/games:
    get:
      summary: Fetch the total count of games
      description: Retrieves the total number of games available in the system.
      responses:
        "200":
          description: Successfully fetched the count of games.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "count fetch successful"
                  data:
                    type: number
                    description: The total count of games.
                    example: 15
        "500":
          description: Server error occurred during games count retrieval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unexpected error occurred"
